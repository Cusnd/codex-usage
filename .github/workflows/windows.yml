name: Windows and macOS checks
run-name: ${{ inputs.revision && format('Release checks {0}', inputs.revision) || format('Compatibility {0}', github.ref_name) }}
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact commit to validate (optional)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ inputs.revision || github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.validation.outputs.tree }}
      reuse: ${{ steps.validation.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/ci-reuse.test.mjs tests/cloud-release.test.mjs
      - id: validation
        run: node scripts/ci-reuse.mjs lookup
        env:
          GH_TOKEN: ${{ github.token }}
  platform-checks:
    needs: inspect
    if: needs.inspect.outputs.reuse != 'true'
    name: ${{ matrix.target.runner }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: windows-latest, platform: win32, arch: x64 }
          - { runner: macos-15, platform: darwin, arch: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64 }
        node: ['22.13.0', '22.x', '24.0.0', '24.x', '26.0.0', '26.x']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: workspace/中文 project
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.arch }}
          cache: npm
          cache-dependency-path: workspace/中文 project/package-lock.json
      - name: Verify native platform and architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.target.platform }}
          EXPECTED_ARCH: ${{ matrix.target.arch }}
        run: node -e "console.log(process.platform, process.arch, process.version); if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
      - run: npm ci
        working-directory: workspace/中文 project
      - run: npm test
        working-directory: workspace/中文 project
      - run: npm run build
        working-directory: workspace/中文 project
      - run: npm run smoke
        working-directory: workspace/中文 project
      - run: npm run package:smoke
        working-directory: workspace/中文 project
      - name: Preserve synthetic lifecycle failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ matrix.target.runner }}-node-${{ matrix.node }}
          path: workspace/中文 project/artifacts/ci-smoke/
          if-no-files-found: ignore
          retention-days: 7
  validated-tree:
    name: Validated tree ${{ needs.inspect.outputs.tree }}
    needs: [inspect, platform-checks]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All 18 native platform/runtime jobs passed.'
  result:
    name: Compatibility result
    if: always()
    needs: [inspect, platform-checks, validated-tree]
    runs-on: ubuntu-latest
    steps:
      - name: Require fresh or reused validation
        env:
          INSPECT: ${{ needs.inspect.result }}
          REUSE: ${{ needs.inspect.outputs.reuse }}
          MATRIX: ${{ needs.platform-checks.result }}
          RECORD: ${{ needs.validated-tree.result }}
        run: test "$INSPECT" = success && { test "$REUSE" = true || { test "$MATRIX" = success && test "$RECORD" = success; }; }
