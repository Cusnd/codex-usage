name: Finish authorized 0.1.5 release
on:
  push:
    branches: [codex/release-0.1.5]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: finish-release-0.1.5
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Complete the authorized release after exact-tree checks
        run: node scripts/finish-release-0.1.5.mjs
        env:
          GH_TOKEN: ${{ github.token }}
