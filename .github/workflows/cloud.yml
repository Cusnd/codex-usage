name: Cloud v3 checks
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'cloud/**'
      - 'web/**'
      - 'shared/**'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cloud
      - run: npm run cloud:build
      - run: npm run cloud:check
      - run: npm run cloud:test
