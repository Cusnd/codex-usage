name: Publish npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  version:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/npm-release.mjs validate
      - name: Require successful checks for the release tree
        run: node scripts/ci-reuse.mjs require
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run build
      - run: node scripts/npm-release.mjs pack
      - run: npm run package:smoke
      - run: node scripts/npm-release.mjs publish
